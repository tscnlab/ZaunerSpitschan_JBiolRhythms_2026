name: Render and publish Quarto
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
      - uses: actions/configure-pages@v5
      - name: Render from committed computational outputs
        run: quarto render --to html
      - name: Check local site links
        run: python3 scripts/check-site.py report
      - uses: actions/upload-pages-artifact@v4
        with:
          path: report
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
